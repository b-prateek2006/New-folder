<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Tic Tac Toe with a friend — fast, fun, and fully responsive.">
    <title>Tic Tac Toe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><line x1='33' y1='5' x2='33' y2='95' stroke='%23555' stroke-width='4'/><line x1='66' y1='5' x2='66' y2='95' stroke='%23555' stroke-width='4'/><line x1='5' y1='33' x2='95' y2='33' stroke='%23555' stroke-width='4'/><line x1='5' y1='66' x2='95' y2='66' stroke='%23555' stroke-width='4'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Tic Tac Toe</h1>

        <div class="turn-indicator">
            <span class="turn-x active">X's Turn</span>
            <span class="turn-o">O's Turn</span>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0" tabindex="0"></div>
            <div class="cell" data-index="1" tabindex="0"></div>
            <div class="cell" data-index="2" tabindex="0"></div>
            <div class="cell" data-index="3" tabindex="0"></div>
            <div class="cell" data-index="4" tabindex="0"></div>
            <div class="cell" data-index="5" tabindex="0"></div>
            <div class="cell" data-index="6" tabindex="0"></div>
            <div class="cell" data-index="7" tabindex="0"></div>
            <div class="cell" data-index="8" tabindex="0"></div>
        </div>

        <div class="scoreboard">
            <div class="score score-x">
                <span class="score-label">X Wins</span>
                <span class="score-value" id="score-x">0</span>
            </div>
            <div class="score score-draw">
                <span class="score-label">Draws</span>
                <span class="score-value" id="score-draw">0</span>
            </div>
            <div class="score score-o">
                <span class="score-label">O Wins</span>
                <span class="score-value" id="score-o">0</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" id="btn-reset">Reset Game</button>
            <button class="btn btn-clear" id="btn-clear">Reset Scores</button>
        </div>
    </div>

    <!-- Result overlay -->
    <div class="overlay" id="overlay">
        <div class="overlay-content">
            <h2 class="result-message" id="result-message"></h2>
            <button class="btn btn-play-again" id="btn-play-again">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
